<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" preserveAspectRatio="none">
  <!-- Painterly wash + fine grain, layered over the brand fill in the hero.
       Grayscale on purpose: the colour comes from the panel underneath. -->
  <filter id="wash" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="3" seed="7" />
    <feColorMatrix type="saturate" values="0" />
  </filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch" seed="3" />
    <feColorMatrix type="saturate" values="0" />
  </filter>
  <rect width="900" height="600" filter="url(#wash)" opacity="0.62" />
  <rect width="900" height="600" filter="url(#grain)" opacity="0.3" />
</svg>
